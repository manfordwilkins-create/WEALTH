<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WEALTH — Wealth Operating System</title>
<style>
:root{--bg:#0b0f14;--panel:#121821;--panel2:#18212c;--text:#eef3f8;--muted:#91a0b2;--line:#263342;--accent:#6ee7b7;--accent2:#60a5fa;--danger:#fb7185;--warn:#fbbf24;--shadow:0 18px 50px #0006}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#17302a 0,#0b0f14 38%);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);background:#0d131b;position:sticky;top:0;height:100vh;padding:22px 16px}.brand{font-weight:900;letter-spacing:.12em;font-size:20px;margin:4px 10px 25px}.brand span{color:var(--accent)}nav button{width:100%;background:transparent;border:0;color:var(--muted);text-align:left;padding:12px 14px;border-radius:10px;margin:3px 0}nav button.active,nav button:hover{background:var(--panel2);color:var(--text)}main{padding:28px;max-width:1250px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:25px}.eyebrow{color:var(--accent);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:12px}.title{font-size:34px;font-weight:900;margin:4px 0}.sub{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:linear-gradient(145deg,#121a24,#10161f);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.label{color:var(--muted);font-size:12px}.value{font-size:27px;font-weight:850;margin-top:5px}.accent{color:var(--accent)}.blue{color:var(--accent2)}.red{color:var(--danger)}.yellow{color:var(--warn)}.section{margin-top:18px}.section h2{font-size:18px;margin:0 0 12px}.two{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:10px}.btn.primary{background:var(--accent);color:#062218;border-color:transparent;font-weight:800}.actions{display:flex;flex-wrap:wrap;gap:8px}.progress{height:9px;background:#0b1016;border-radius:99px;overflow:hidden;margin-top:10px}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}.table th{color:var(--muted);font-size:12px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.form input{width:100%;background:#0d131b;border:1px solid var(--line);color:var(--text);padding:11px;border-radius:10px}.empty{padding:25px;text-align:center;color:var(--muted)}.toast{position:fixed;right:18px;bottom:18px;background:#17212b;border:1px solid var(--line);padding:12px 15px;border-radius:10px;display:none}.small{font-size:12px;color:var(--muted)}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{height:auto;position:relative;border-right:0;border-bottom:1px solid var(--line);padding:12px}.brand{margin-bottom:8px}nav{display:flex;overflow:auto;gap:4px}nav button{white-space:nowrap;width:auto}main{padding:18px}.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.form{grid-template-columns:1fr}.title{font-size:28px}}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.value{font-size:21px}}
</style>
</head>
<body>
<div class="shell"><aside class="side"><div class="brand"><span>W</span>EALTH</div><nav id="nav"></nav><div class="small" style="margin:25px 10px">Your data stays in this browser.</div></aside><main><div id="app"></div></main></div><div id="toast" class="toast"></div>
<script>
const KEY='wealth-operating-system-v1';
const seed={cash:2500,investments:0,debt:0,income:5000,savingsGoal:10000,saved:2500,monthlyInvest:500,transactions:[{date:new Date().toISOString().slice(0,10),type:'Income',amount:5000,note:'Starting income'}],goals:[{name:'Emergency fund',target:10000,current:2500},{name:'Investing',target:10000,current:0}]};let state=load(),page='Dashboard';function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){return structuredClone(seed)}}function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}function money(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Number(n)||0)}function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}const pages=['Dashboard','Cash Flow','Goals','Transactions','Settings'];document.getElementById('nav').innerHTML=pages.map(x=>`<button data-page="${x}">${x}</button>`).join('');document.getElementById('nav').onclick=e=>{let b=e.target.closest('button');if(b){page=b.dataset.page;render()}};
function dashboard(){let net=state.cash+state.investments-state.debt;let monthly=state.income-state.monthlyInvest;return `<div class="top"><div><div class="eyebrow">Wealth Operating System</div><div class="title">Build wealth on purpose.</div><div class="sub">A simple command center for your money.</div></div><button class="btn primary" onclick="quickAdd()">+ Add transaction</button></div><div class="grid"><div class="card"><div class="label">Net worth</div><div class="value accent">${money(net)}</div></div><div class="card"><div class="label">Cash</div><div class="value">${money(state.cash)}</div></div><div class="card"><div class="label">Investments</div><div class="value blue">${money(state.investments)}</div></div><div class="card"><div class="label">Debt</div><div class="value red">${money(state.debt)}</div></div></div><div class="two section"><div class="card"><h2>Monthly engine</h2><div class="row"><span>Income</span><b>${money(state.income)}</b></div><div class="row"><span>Investing</span><b class="blue">${money(state.monthlyInvest)}</b></div><div class="row"><span>Available after investing</span><b>${money(monthly)}</b></div><div class="row"><span>Investment rate</span><b>${pct(state.monthlyInvest,state.income)}%</b></div></div><div class="card"><h2>Next milestone</h2><b>${state.goals[0]?.name||'Goal'}</b><div class="value">${money(state.goals[0]?.current||0)} <span class="small">/ ${money(state.goals[0]?.target||0)}</span></div><div class="progress"><i style="width:${pct(state.goals[0]?.current||0,state.goals[0]?.target||1)}%"></i></div><div class="small" style="margin-top:8px">${pct(state.goals[0]?.current||0,state.goals[0]?.target||1)}% complete</div></div></div><div class="card section"><h2>Recent activity</h2>${state.transactions.slice(-5).reverse().map(t=>`<div class="row"><span>${t.note||t.type}<div class="small">${t.date} · ${t.type}</div></span><b class="${t.type==='Expense'?'red':'accent'}">${t.type==='Expense'?'-':'+'}${money(t.amount)}</b></div>`).join('')||'<div class="empty">No transactions yet.</div>'}</div>`}
function cash(){return `<div class="top"><div><div class="eyebrow">Cash Flow</div><div class="title">Control the flow.</div><div class="sub">Set the numbers that drive your monthly plan.</div></div></div><div class="card"><div class="form"><label>Monthly income<input id="income" type="number" value="${state.income}"></label><label>Monthly investing<input id="invest" type="number" value="${state.monthlyInvest}"></label><label>Cash on hand<input id="cash" type="number" value="${state.cash}"></label></div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="updateCash()">Save plan</button></div></div><div class="grid section"><div class="card"><div class="label">Income</div><div class="value accent">${money(state.income)}</div></div><div class="card"><div class="label">Investing</div><div class="value blue">${money(state.monthlyInvest)}</div></div><div class="card"><div class="label">Free cash</div><div class="value">${money(state.income-state.monthlyInvest)}</div></div><div class="card"><div class="label">Rate</div><div class="value">${pct(state.monthlyInvest,state.income)}%</div></div></div>`}
function goals(){return `<div class="top"><div><div class="eyebrow">Goals</div><div class="title">Turn targets into milestones.</div></div><button class="btn primary" onclick="addGoal()">+ Add goal</button></div><div class="grid">${state.goals.map((g,i)=>`<div class="card"><div class="label">Goal</div><h2>${g.name}</h2><div class="value">${money(g.current)}</div><div class="small">of ${money(g.target)}</div><div class="progress"><i style="width:${pct(g.current,g.target)}%"></i></div><div class="row"><span>${pct(g.current,g.target)}% complete</span><button class="btn" onclick="fundGoal(${i})">Add money</button></div></div>`).join('')}</div>`}
function transactions(){return `<div class="top"><div><div class="eyebrow">Ledger</div><div class="title">Know where every dollar goes.</div></div><button class="btn primary" onclick="quickAdd()">+ Add transaction</button></div><div class="card"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>Note</th><th>Amount</th></tr></thead><tbody>${state.transactions.slice().reverse().map(t=>`<tr><td>${t.date}</td><td>${t.type}</td><td>${t.note||''}</td><td class="${t.type==='Expense'?'red':'accent'}">${t.type==='Expense'?'-':'+'}${money(t.amount)}</td></tr>`).join('')}</tbody></table></div>`}
function settings(){return `<div class="top"><div><div class="eyebrow">Settings</div><div class="title">Your system.</div><div class="sub">Everything is stored locally on this device.</div></div></div><div class="card"><h2>Data</h2><div class="actions"><button class="btn" onclick="exportData()">Export backup</button><button class="btn" onclick="resetData()">Reset demo data</button></div><p class="small">WEALTH does not send your financial data to a server in this version.</p></div>`}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('app').innerHTML=page==='Dashboard'?dashboard():page==='Cash Flow'?cash():page==='Goals'?goals():page==='Transactions'?transactions():settings()}function quickAdd(){let type=prompt('Type: Income or Expense','Expense');if(!type)return;type=type.trim();if(!/^(Income|Expense)$/i.test(type)){toast('Use Income or Expense');return}let amount=Number(prompt('Amount','100'));if(!amount)return;let note=prompt('What was it for?','');state.transactions.push({date:new Date().toISOString().slice(0,10),type:type[0].toUpperCase()+type.slice(1).toLowerCase(),amount,note});if(type.toLowerCase()==='income')state.cash+=amount;else state.cash-=amount;save();toast('Transaction added')}function updateCash(){state.income=Number(document.getElementById('income').value)||0;state.monthlyInvest=Number(document.getElementById('invest').value)||0;state.cash=Number(document.getElementById('cash').value)||0;save();toast('Plan saved')}function addGoal(){let name=prompt('Goal name','New goal');if(!name)return;let target=Number(prompt('Target amount','5000'));if(!target)return;state.goals.push({name,target,current:0});save();toast('Goal created')}function fundGoal(i){let amount=Number(prompt('Amount to add','250'));if(!amount)return;state.goals[i].current+=amount;state.cash-=amount;save();toast('Goal funded')}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='wealth-backup.json';a.click()}function resetData(){if(confirm('Reset WEALTH to the starter data?')){state=structuredClone(seed);save();toast('Reset complete')}}render();
</script></body></html>
